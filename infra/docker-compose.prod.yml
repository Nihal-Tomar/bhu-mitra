name: bhumitra-prod

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhumitra_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - bhumitra_prod_net

  redis:
    image: redis:7-alpine
    container_name: bhumitra_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - bhumitra_prod_net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: bhumitra_prod_minio
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_prod_data:/data
    networks:
      - bhumitra_prod_net

  api:
    image: bhumitra/api:latest
    container_name: bhumitra_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      INTELLIGENCE_SERVICE_URL: http://intelligence:8000
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - bhumitra_prod_net

  web:
    image: bhumitra/web:latest
    container_name: bhumitra_prod_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      NEXT_PUBLIC_DEMO_MODE: "false"
    depends_on:
      - api
    networks:
      - bhumitra_prod_net

  intelligence:
    image: bhumitra/intelligence:latest
    container_name: bhumitra_prod_intelligence
    restart: always
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - bhumitra_prod_net

  nginx:
    image: nginx:1.25-alpine
    container_name: bhumitra_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
      - intelligence
    networks:
      - bhumitra_prod_net

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  bhumitra_prod_net:
    driver: bridge
