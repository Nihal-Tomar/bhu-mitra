name: bhumitra

services:
  # Primary Relational & Spatial Database
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhumitra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhumitra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhumitra_secure_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bhumitra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhumitra} -d ${POSTGRES_DB:-bhumitra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhumitra_net

  # In-Memory Cache, Sessions & Queue Store
  redis:
    image: redis:7-alpine
    container_name: bhumitra_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhumitra_net

  # S3-Compatible Object Storage (Documents, Cadastral Maps, Evidence)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: bhumitra_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-bhumitra_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-bhumitra_minio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - bhumitra_net

  # NestJS Core API Backend
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: bhumitra_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-bhumitra}:${POSTGRES_PASSWORD:-bhumitra_secure_dev}@postgres:5432/${POSTGRES_DB:-bhumitra}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-bhumitra_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-bhumitra_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-bhumitra-documents}
      JWT_SECRET: ${JWT_SECRET:-bhumitra_dev_jwt_secret_change_in_production_si2026}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      INTELLIGENCE_SERVICE_URL: http://intelligence:8000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bhumitra_net

  # Next.js Web Frontend
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: bhumitra_web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_VERSION: 1.0.0-sih
      NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - bhumitra_net

  # Python FastAPI Intelligence & Decision Support Service
  intelligence:
    build:
      context: ../apps/intelligence
      dockerfile: Dockerfile
    container_name: bhumitra_intelligence
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bhumitra}:${POSTGRES_PASSWORD:-bhumitra_secure_dev}@postgres:5432/${POSTGRES_DB:-bhumitra}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bhumitra_net

  # Reverse Proxy & Edge Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: bhumitra_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - intelligence
    networks:
      - bhumitra_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  bhumitra_net:
    driver: bridge
